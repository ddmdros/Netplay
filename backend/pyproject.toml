[project]
name = "netplay-backend"
version = "1.1.0"
description = "API do NetPlay: agente de games com tool calling (LangChain + OpenAI) e dados da RAWG."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn>=0.47",
    "langchain>=1.1,<2",
    "langchain-core>=1.4,<2",
    "langchain-openai>=1.2,<2",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.2",
    "requests>=2.32",
]

[dependency-groups]
dev = ["httpx>=0.28"]
